# Continuous integration: type-check, test (with a real PostgreSQL) and build on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imtixaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imtixaan_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imtixaan_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/imtixaan_test
      JWT_SECRET: ci-secret-that-is-long-enough-1234567890
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Type-check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
